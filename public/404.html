<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>Redirecting…</title></head>
  <body><script>const parts=location.pathname.split('/').filter(Boolean);const base=parts.length?`/${parts[0]}/`:'/';sessionStorage.setItem('spa-redirect',location.pathname+location.search+location.hash);location.replace(base)</script></body>
</html>
